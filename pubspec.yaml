name: egypt_tour_guide
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^16.0.0
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1
  http: ^1.5.0
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.12.3
  panorama_viewer: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/pyramids.png
    - assets/images/logo.png
    - assets/images/karnak.jpg
    - assets/images/sphinex.jpg
    - assets/images/sphinex_close.jpg
    - assets/images/sphinex_hologram.png